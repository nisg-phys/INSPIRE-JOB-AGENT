[project]
name = "inspire-jobs-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "pgvector",
    "requests",
    # Imported directly by inspire_literature_client, and needed by
    # fastapi.testclient. It only arrived transitively via openai/groq
    # before, so a change in their dependencies would have broken us.
    "httpx",
    "alembic",
    "python-dotenv",
    "groq",
    "openai",
    "opik",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
