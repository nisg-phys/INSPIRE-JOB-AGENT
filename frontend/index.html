<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inspire Jobs Agent</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 1rem;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 0.5rem;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #f0f0f0;
      }
      td ul {
        margin: 0;
        padding-left: 1.1rem;
      }
      .muted {
        color: #888;
      }
      #status {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Inspire Jobs Agent</h1>

    <form id="search-form">
      <input
        type="text"
        id="query"
        placeholder="e.g. postdoc in string theory"
        size="50"
        required
      />
      <button type="submit">Search</button>
    </form>

    <div id="status"></div>
    <button id="download-csv" type="button" hidden>Download CSV</button>
    <div id="results"></div>

    <script>
      // T8.4 will point this at the deployed backend instead.
      const API_BASE_URL = "http://localhost:8000";

      const form = document.getElementById("search-form");
      const queryInput = document.getElementById("query");
      const statusEl = document.getElementById("status");
      const resultsEl = document.getElementById("results");
      const downloadButton = document.getElementById("download-csv");

      let lastResults = [];

      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value ?? "";
        return div.innerHTML;
      }

      // Only render http(s) links as clickable - Inspire is an external
      // data source, so don't trust a field value into an href unchecked
      // (e.g. a stray "javascript:" URI).
      function titleCellHtml(job) {
        const text = escapeHtml(job.title);
        if (job.link && /^https?:\/\//i.test(job.link)) {
          return `<a href="${escapeHtml(job.link)}" target="_blank" rel="noopener">${text}</a>`;
        }
        return text;
      }

      function textOrDash(value) {
        return value ? escapeHtml(value) : '<span class="muted">—</span>';
      }

      // Enrichment data (T4.5) is empty, not missing, when a job's
      // institution hasn't been processed by the worker yet - degrade to a
      // plain note rather than an empty cell that looks broken.
      function papersCellHtml(papers) {
        if (!papers || papers.length === 0) {
          return '<span class="muted">Not yet available</span>';
        }
        const items = papers
          .map((p) => `<li>${escapeHtml(p.title)} (${p.citation_count} citations)</li>`)
          .join("");
        return `<ul>${items}</ul>`;
      }

      function renderTable(jobs) {
        if (!jobs || jobs.length === 0) {
          return '<p class="muted">No results.</p>';
        }

        const rows = jobs
          .map(
            (job) => `
              <tr>
                <td>${titleCellHtml(job)}</td>
                <td>${textOrDash(job.institution)}</td>
                <td>${textOrDash(job.deadline)}</td>
                <td>${textOrDash(job.location)}</td>
                <td>${textOrDash((job.tags || []).join(", "))}</td>
                <td>${papersCellHtml(job.recent_papers)}</td>
              </tr>`
          )
          .join("");

        return `
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Institution</th>
                <th>Deadline</th>
                <th>Location</th>
                <th>Tags</th>
                <th>Recent Papers</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;
      }

      function csvField(value) {
        // Always quote, and double up any embedded quotes - simplest way to
        // stay correct for fields that may contain commas, quotes, or
        // newlines (paper titles pulled from Inspire can have any of these).
        return `"${String(value ?? "").replace(/"/g, '""')}"`;
      }

      function papersToCsvField(papers) {
        if (!papers || papers.length === 0) return "";
        return papers.map((p) => `${p.title} (${p.citation_count} citations)`).join("; ");
      }

      function buildCsv(jobs) {
        const header = ["Title", "Institution", "Deadline", "Location", "Tags", "Recent Papers", "Link"];
        const lines = [header.map(csvField).join(",")];
        for (const job of jobs) {
          lines.push(
            [
              job.title,
              job.institution,
              job.deadline ?? "",
              job.location ?? "",
              (job.tags || []).join(", "),
              papersToCsvField(job.recent_papers),
              job.link ?? "",
            ]
              .map(csvField)
              .join(",")
          );
        }
        // CRLF is the CSV-spec line ending and what Excel expects.
        return lines.join("\r\n");
      }

      downloadButton.addEventListener("click", () => {
        if (lastResults.length === 0) return;
        const blob = new Blob([buildCsv(lastResults)], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "inspire-jobs.csv";
        link.click();
        URL.revokeObjectURL(url);
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusEl.textContent = "Loading...";
        resultsEl.innerHTML = "";
        downloadButton.hidden = true;
        lastResults = [];

        try {
          const response = await fetch(`${API_BASE_URL}/jobs/search`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: queryInput.value }),
          });
          const data = await response.json();

          if (data.needs_clarification) {
            // T7.4 makes this interactive; for now, just surface the question.
            statusEl.textContent = data.clarification_question;
            return;
          }

          lastResults = data.results;
          downloadButton.hidden = lastResults.length === 0;

          statusEl.textContent = data.cached
            ? `${data.results.length} result(s) (cached)`
            : `${data.results.length} result(s)`;
          resultsEl.innerHTML = renderTable(data.results);
        } catch (err) {
          statusEl.textContent = `Error: ${err}`;
        }
      });
    </script>
  </body>
</html>
