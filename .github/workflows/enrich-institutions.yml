name: Enrich institution papers

on:
  schedule:
    # Once a day at 06:00 UTC. Discovery/enrichment is idempotent and cheap
    # (institution_papers entries are only refreshed past a 7-day TTL - see
    # worker/worker/discovery.py), so daily is more than enough.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker
        working-directory: worker
        run: pip install -e .

      - name: Run enrichment worker
        working-directory: worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m worker.main
